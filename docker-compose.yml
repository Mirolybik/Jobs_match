name: jobsmatch

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobsmatch
      POSTGRES_USER: jobsmatch
      POSTGRES_PASSWORD: jobsmatch
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobsmatch -d jobsmatch']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://jobsmatch:jobsmatch@db:5432/jobsmatch?schema=public
      TRUST_PROXY: 'true'
      CORS_ORIGINS: https://localhost:8443,http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

  # HTTPS-стенд из ТЗ: Caddy терминирует TLS и проксирует запросы в app.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '8443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
  caddy_data:
  caddy_config:
